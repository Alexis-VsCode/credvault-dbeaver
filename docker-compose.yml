# Demo completa en contenedores (datos ficticios, sin DBeaver local).
#   docker compose up --build
#   Frontend: http://localhost:8080   ·   API: http://localhost:8000/docs
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      CREDVAULT_DEMO: "1"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
