<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Segoe UI, system-ui, sans-serif">
  <style>
    .title{font-size:16px;font-weight:600;fill:#0C447C}
    .layer{font-size:13px;font-weight:600}
    .box{font-size:12px;fill:#1a2230}
    .sub{font-size:11px;fill:#5f6b7d}
    .tag{font-size:11px;font-weight:600;fill:#ffffff}
  </style>
  <rect width="920" height="560" fill="#f4f6f9"/>

  <!-- BACKEND -->
  <text x="40" y="40" class="title">Backend · FastAPI (hexagonal)</text>
  <!-- infra outer -->
  <rect x="40" y="55" width="400" height="230" rx="12" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="56" y="76" class="layer" fill="#185FA5">infrastructure · adaptadores</text>
  <rect x="56" y="88" width="120" height="48" rx="8" fill="#ffffff" stroke="#b5d4f4"/>
  <text x="66" y="108" class="box">AES decryptor</text>
  <text x="66" y="124" class="sub">crypto/</text>
  <rect x="186" y="88" width="120" height="48" rx="8" fill="#ffffff" stroke="#b5d4f4"/>
  <text x="196" y="108" class="box">Filesystem finder</text>
  <text x="196" y="124" class="sub">finders/</text>
  <rect x="316" y="88" width="112" height="48" rx="8" fill="#ffffff" stroke="#b5d4f4"/>
  <text x="326" y="108" class="box">DataSources</text>
  <text x="326" y="124" class="sub">metadata/</text>
  <rect x="56" y="144" width="120" height="44" rx="8" fill="#ffffff" stroke="#b5d4f4"/>
  <text x="66" y="170" class="box">API REST · CLI</text>
  <rect x="186" y="144" width="120" height="44" rx="8" fill="#ffffff" stroke="#b5d4f4"/>
  <text x="196" y="164" class="box">DTO / schemas</text>
  <text x="196" y="180" class="sub">anticorrupción</text>
  <rect x="316" y="144" width="112" height="44" rx="8" fill="#ffffff" stroke="#b5d4f4"/>
  <text x="326" y="170" class="box">deps · demo</text>

  <!-- application -->
  <rect x="80" y="198" width="320" height="42" rx="8" fill="#378ADD"/>
  <text x="96" y="215" class="tag">application · puertos + casos de uso</text>
  <text x="96" y="232" style="font-size:11px;fill:#E6F1FB">ScanInstallations · RecoverCredentials</text>

  <!-- domain -->
  <rect x="120" y="248" width="240" height="30" rx="8" fill="#0C447C"/>
  <text x="136" y="268" class="tag">domain · modelos puros</text>

  <!-- FRONTEND -->
  <text x="480" y="40" class="title">Frontend · React (misma simetría)</text>
  <rect x="480" y="55" width="400" height="230" rx="12" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="496" y="76" class="layer" fill="#185FA5">infrastructure</text>
  <rect x="496" y="88" width="170" height="48" rx="8" fill="#ffffff" stroke="#b5d4f4"/>
  <text x="506" y="108" class="box">HttpApiClient</text>
  <text x="506" y="124" class="sub">fetch real</text>
  <rect x="676" y="88" width="188" height="48" rx="8" fill="#ffffff" stroke="#b5d4f4"/>
  <text x="686" y="108" class="box">DemoApiClient</text>
  <text x="686" y="124" class="sub">sin backend (LSP)</text>
  <text x="496" y="158" class="layer" fill="#185FA5">ui · componentes</text>
  <rect x="496" y="166" width="110" height="40" rx="8" fill="#ffffff" stroke="#b5d4f4"/>
  <text x="506" y="190" class="box">Navbar</text>
  <rect x="614" y="166" width="120" height="40" rx="8" fill="#ffffff" stroke="#b5d4f4"/>
  <text x="624" y="190" class="box">ScanSidebar</text>
  <rect x="742" y="166" width="122" height="40" rx="8" fill="#ffffff" stroke="#b5d4f4"/>
  <text x="752" y="190" class="box">CredentialRow</text>

  <rect x="520" y="214" width="320" height="34" rx="8" fill="#378ADD"/>
  <text x="536" y="235" class="tag">application · ApiClient (puerto) + useRecovery</text>
  <rect x="560" y="252" width="240" height="26" rx="8" fill="#0C447C"/>
  <text x="576" y="270" class="tag">domain · tipos (models.ts)</text>

  <!-- flujo -->
  <text x="40" y="330" class="title">Flujo de una recuperación</text>
  <g font-size="12">
    <rect x="40" y="345" width="150" height="40" rx="8" fill="#ffffff" stroke="#378ADD"/>
    <text x="52" y="369" class="box">1 · Escanear</text>
    <rect x="215" y="345" width="150" height="40" rx="8" fill="#ffffff" stroke="#378ADD"/>
    <text x="227" y="369" class="box">2 · Descifrar AES</text>
    <rect x="390" y="345" width="150" height="40" rx="8" fill="#ffffff" stroke="#378ADD"/>
    <text x="402" y="369" class="box">3 · Unir metadatos</text>
    <rect x="565" y="345" width="150" height="40" rx="8" fill="#ffffff" stroke="#378ADD"/>
    <text x="577" y="369" class="box">4 · RecoveryReport</text>
    <rect x="740" y="345" width="140" height="40" rx="8" fill="#0C447C"/>
    <text x="752" y="369" class="tag">5 · API / CLI / UI</text>
    <path d="M190 365 h25 M365 365 h25 M540 365 h25 M715 365 h25" stroke="#185FA5" stroke-width="2" marker-end="url(#a)"/>
    <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#185FA5"/></marker></defs>
  </g>

  <!-- principios -->
  <text x="40" y="430" class="title">Regla de dependencias</text>
  <text x="40" y="452" class="box">Las flechas de dependencia apuntan siempre hacia adentro: </text>
  <text x="40" y="470" class="sub">infrastructure → application → domain.  El dominio no conoce a nadie (DIP).</text>
  <text x="40" y="494" class="box">SOLID: SRP por adaptador · OCP nuevos adaptadores · LSP demo↔real · ISP puertos chicos · DIP inyección.</text>
  <text x="40" y="520" class="sub">Metodología: DDD (lenguaje ubicuo) + TDD (tests primero) + ODD (log observable de punta a punta).</text>
</svg>
